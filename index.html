<title>Intercity Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas. Menu = live 3D character preview + bottom panel (side panel on wide screens). Single dark look by choice. */
:root{
  --ink:#0c0a18; --panel:#16132b; --panel2:#201b40; --line:#322c5e;
  --text:#f4f1ff; --muted:#a8a2d2; --hot:#ff3d7f; --volt:#ffe14a; --cyan:#3df0ff; --warden:#ff2d2d;
  --you:#3df0ff; --rook:#f2c230; --vex:#7be34f; --sel:#ff3d7f;
  --font-display:'Bungee',Impact,'Arial Black',sans-serif;
  --font-body:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-body);font-size:15px;overflow:hidden;margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen.center{justify-content:center;align-items:center;padding:16px;overflow-y:auto;background:rgba(12,10,24,.72);touch-action:pan-y}

/* menu */
#menu{padding:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.brand{font-family:var(--font-display);font-size:clamp(1.15rem,5vw,1.8rem);line-height:1;margin:0;transform:skew(-6deg);text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.brand span{color:var(--hot);text-shadow:2px 2px 0 var(--cyan)}
.topr{display:flex;align-items:center;gap:8px}
.chipc{display:flex;align-items:center;gap:7px;background:rgba(22,19,43,.9);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--font-display);font-size:.95rem;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:8px 4px;font-size:.82rem}
.menu-body{flex:1;min-height:0;display:flex;flex-direction:column}
.preview{flex:1 1 0;min-height:120px;position:relative;pointer-events:none}
.pname{position:absolute;left:16px;bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.pname b{display:block;font-family:var(--font-display);font-size:clamp(1.6rem,7vw,2.6rem);text-transform:uppercase;line-height:1}
.pname span{color:var(--muted);font-size:.9rem}
.panel{background:rgba(16,12,34,.95);border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:58%;min-height:0}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:9px 6px;cursor:pointer;font-family:var(--font-display);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.tabbody{flex:1;min-height:0;overflow-y:auto;touch-action:pan-x pan-y;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x pan-y;flex:none}
.rc{flex:none;min-width:88px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.rc small{color:var(--muted);font-size:.72rem}
.rc[aria-pressed="true"]{border-color:var(--c);background:var(--panel2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);color:#0c0a18;font-size:1.05rem;background:var(--c)}
.rc.locked .av{filter:grayscale(.8) brightness(.6)}
.detail{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dn{font-family:var(--font-display);font-size:1.15rem;text-transform:uppercase}
.role{color:var(--muted);font-size:.85rem}
.perk{color:var(--volt);font-size:.85rem;margin:0}
.up{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center}
.ul{font-size:.82rem;font-weight:700}
.ue{display:block;color:var(--muted);font-size:.7rem;font-weight:400}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:9px;border-radius:2px;background:var(--line);max-width:26px}
.pips i.on{background:var(--c,var(--hot))}
.mini{background:var(--hot);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}
.mini:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.mini.alt{background:var(--panel2);border:2px solid var(--line)}
.bgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.bc{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bc.eq{border-color:var(--c)}
.bc .sw2{height:6px;border-radius:3px;background:var(--c);box-shadow:0 0 10px var(--c)}
.bc b{font-family:var(--font-display);font-size:.95rem;text-transform:uppercase}
.bc p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.35}
.city{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.city[aria-pressed="true"]{border-color:var(--c);background:var(--panel2);box-shadow:0 0 0 1px var(--c)}
.city.lock{opacity:.55}
.city .nm{font-family:var(--font-display);font-size:1rem;text-transform:uppercase}
.city .sb{color:var(--muted);font-size:.8rem}
.city .meta{display:flex;justify-content:space-between;gap:6px;font-size:.76rem;margin-top:4px;flex-wrap:wrap}
.playrow{display:flex;gap:10px;align-items:center}
.sum{flex:1;min-width:0;color:var(--muted);font-size:.78rem;line-height:1.3}
.sum b{color:var(--text)}
.btn{background:var(--hot);color:#fff;border:0;border-radius:10px;padding:13px 22px;font-family:var(--font-display);font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn.alt{background:var(--panel2);border:2px solid var(--line);color:var(--text)}
.btn.grow{flex:1 1 160px}
@media (min-width:820px){
  .menu-body{flex-direction:row}
  .preview{flex:1}
  .panel{width:min(500px,46%);max-height:none;border-radius:16px 0 0 0;border-left:2px solid var(--line);order:2}
}

/* overlays */
.sheet{background:rgba(22,19,43,.95);border:2px solid var(--line);border-radius:14px;padding:22px;max-width:540px;width:100%;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);font-weight:700;margin:0}
.sheet h2{font-family:var(--font-display);font-size:clamp(1.6rem,7vw,2.3rem);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.sheet p{margin:0;line-height:1.5}
.quote{color:var(--muted);border-left:3px solid var(--sel);padding-left:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.stats div{background:var(--panel2);border-radius:8px;padding:10px}
.stats small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.stats b{font-family:var(--font-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px 0;gap:8px}
.stat .k{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.stat .v small{font-size:.7rem;color:var(--muted)}
.stat.right{text-align:right}.stat.right .v{justify-content:flex-end}
.pos{font-family:var(--font-display);font-size:2rem;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.pos.first{color:var(--volt)}
.coin{width:14px;height:14px;border-radius:50%;background:var(--volt);display:inline-block;box-shadow:0 0 8px var(--volt);flex:none}
.race{position:relative;margin:8px 16px 0;height:22px}
.rail{position:absolute;left:0;right:0;top:10px;height:3px;background:rgba(255,255,255,.28);border-radius:2px}
.dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;margin-left:-7px;border:2px solid var(--ink)}
.dot.you{background:var(--you);z-index:3;width:16px;height:16px;top:3px;margin-left:-8px}
.dot.b1{background:var(--rook)}.dot.b2{background:var(--vex)}.dot.w{background:var(--warden);border-radius:3px;transform:rotate(45deg)}
.flag{position:absolute;right:-6px;top:3px;width:12px;height:16px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/6px 6px;border:1px solid #000}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:2px 16px 0;font-size:.74rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.sw.you{background:var(--you)}.sw.b1{background:var(--rook)}.sw.b2{background:var(--vex)}.sw.w{background:var(--warden);border-radius:2px}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.chips span{background:rgba(22,19,43,.88);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--font-display);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
#toast{position:absolute;top:118px;left:50%;transform:translateX(-50%);background:rgba(22,19,43,.92);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--font-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#blastBtn{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:92px;height:92px;border-radius:50%;border:0;padding:0;cursor:pointer;pointer-events:auto;touch-action:none;
  background:conic-gradient(var(--volt) calc(var(--m,0)*1%),var(--line) 0);display:grid;place-items:center}
#blastBtn::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}
#blastBtn span{position:relative;font-family:var(--font-display);font-size:.9rem;letter-spacing:.04em}
#blastBtn.ready{animation:pulse .6s ease-in-out infinite alternate}
#blastBtn.ready::before{background:var(--hot)}
#blastBtn.active::before{background:var(--cyan)}
#blastBtn.active span{color:#0c0a18}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.09)}}
@keyframes pulse2{from{transform:scale(1)}to{transform:scale(1.09)}}
@media (min-aspect-ratio:1/1){#blastBtn{left:auto;right:calc(28px + env(safe-area-inset-right,0px));transform:none}#blastBtn.ready{animation-name:pulse2}}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,45,45,.9))}
#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--font-display);font-size:clamp(5rem,30vw,12rem);text-shadow:4px 4px 0 var(--hot),8px 8px 0 rgba(0,0,0,.4)}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;background:var(--ink);z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="gl"></canvas>
  <div id="vig"></div>

  <div id="hud" hidden>

      <div class="stat"><span class="k">Distance</span><span class="v"><b id="hDist">0</b><small id="hGoal">/ 1800 m</small></span></div>

    <div id="toast"></div>
    <button id="blastBtn" type="button" aria-label="Blast boost"><span>BLAST</span></button>
  </div>

  <div id="count" hidden></div>

  <section id="menu" class="screen">
    <div class="topbar">
      <h1 class="brand">Intercity <span>Blast</span></h1>
      <div class="topr"><div class="chipc"><i class="coin"></i><b id="mCoins">0</b></div><button class="link" id="credBtn" type="button">Credits</button><button class="link" id="muteBtn" type="button">Sound: on</button></div>
    </div>

          <button type="button" role="tab" data-tab="boards">Boards</button>
          <button type="button" role="tab" data-tab="maps">Destinations</button>
        </div>
        <div class="tabbody" id="tabbody"></div>
        <div class="playrow"><div class="sum" id="sum"></div><button class="btn" id="goBtn" type="button">Play</button></div>
      </div>
    </div>
  </section>

  <section id="story" class="screen center" hidden>
    <div class="sheet">
      <p class="eyebrow" id="sEye"></p>
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <p class="quote" id="sQuote"></p>
      <div class="row"><button class="btn grow" id="sGo" type="button">Run</button><button class="btn alt" id="sBack" type="button">Back</button></div>
    </div>
  </section>

  <section id="credits" class="screen center" hidden>
    <div class="sheet" style="text-align:center;align-items:center">
      <div class="eyebrow">Credits</div>
      <h2>Intercity Blast</h2>
      <div style="display:flex;flex-direction:column;gap:18px;margin:8px 0">
        <div><div class="eyebrow">Producer</div><div style="font-family:var(--font-display);font-size:1.5rem;color:var(--volt)">Arindam Dutta</div></div>
        <div><div class="eyebrow">Co-producer</div><div style="font-family:var(--font-display);font-size:1.5rem;color:var(--cyan)">Prathyusha Maitra</div></div>
      </div>
      <div class="row"><button class="btn grow" id="credBack" type="button">Back</button></div>
    </div>
  </section>
  <section id="result" class="screen center" hidden>
    <div class="sheet">
      <p class="eyebrow" id="rEye"></p>
      <h2 id="rTitle"></h2>
      <div class="stats" id="rStats"></div>
      <p id="rText"></p>
      <div class="row">
        <button class="btn grow" id="rNext" type="button">Next city</button>
        <button class="btn alt" id="rRetry" type="button">Run again</button>
        <button class="btn alt" id="rMenu" type="button">Menu</button>
      </div>
    </div>
  </section>

  <div id="fatal" hidden><p>This browser could not start 3D graphics.<br>Try the latest Chrome, Safari or Edge.</p></div>
</div>

function poseRunner(r,o){

    for(i=0;i<e.scarf.length;i++){e.scarf[i].position.x=Math.sin(t*10-i*0.9)*0.06*(i+1);e.scarf[i].rotation.y=Math.sin(t*10-i*0.9)*0.3;}
    for(i=0;i<e.flames.length;i++){e.flames[i].scale.y=1+Math.sin(t*20+i*2)*0.28;}
    if(e.halo)e.halo.rotation.z=t*2;
    if(e.swing)for(i=0;i<e.swing.length;i++){var sg=e.swing[i];sg.g.rotation.x=sg.bx+Math.sin(t*10+sg.ph)*sg.ax;sg.g.rotation.z=Math.sin(t*8+sg.ph*1.7)*sg.az;}
  }

  if(air&&!r.wasAir)r.side=Math.sin(o.phase)>=0?1:-1;
  if(!air&&r.wasAir)r.landT=0.17;
  r.wasAir=air;if(r.landT>0)r.landT-=DT;

  w.slide=approach(w.slide,o.slide?1:0,20);
  w.land=approach(w.land,(r.landT>0&&!o.slide)?1:0,20);
  w.board=approach(w.board,o.board?1:0,14);
  w.hurt=approach(w.hurt,o.hurt>0?1:0,16);
  w.cheer=approach(w.cheer,o.cheer?1:0,6);
  w.fall=approach(w.fall,o.fall?1:0,7);
  var a=clamp(0.55+(o.v-8)/30,0.55,1.15);
  var P=runPose(o.phase,a);
  if(w.board>0.01)mixPose(P,boardPose(t),w.board);
  if(w.hurt>0.01)mixPose(P,stumblePose(P,t),w.hurt);
  if(w.cheer>0.01)mixPose(P,cheerPose(P,t),w.cheer);
  if(w.land>0.01)mixPose(P,landPose(),w.land);
  if(w.air>0.01)mixPose(P,airPose(clamp(o.vy/14,-1,1),r.side),w.air);
  if(w.slide>0.01)mixPose(P,slidePose(),w.slide);

  r.armL.rotation.x=P.la;r.armR.rotation.x=P.ra;r.armL.rotation.z=P.laz;r.armR.rotation.z=P.raz;
  r.elbows[0].rotation.x=P.le;r.elbows[1].rotation.x=P.re;

function act(a){
  if(S.mode!=='play')return;var p=S.p;
  if(a==='left'){p.lane=Math.max(0,p.lane-1);}
  else if(a==='right'){p.lane=Math.min(2,p.lane+1);}
  else if(a==='jump'){if(p.y<=0.001){p.vy=14*stats(S.char).jump;p.slide=0;sfx.jump();}}
  else if(a==='slide'){if(p.y<=0.001){p.slide=0.55;sfx.slide();}else{p.vy=-26;}}
  else if(a==='blast'){if(p.meter>=100&&p.blast<=0){p.blast=3;p.meter=0;p.hitCd=0;sfx.blast();toast('BLAST!');}}
}

/* ---------- simulation ---------- */
function vBaseFor(c,p){return 22+2.2*c.lvl+13*clamp(p.dist/c.goal,0,1);}

function playStep(dt){
  var c=CITIES[S.city],p=S.p,i,o,dz,st=stats(S.char),vBase=vBaseFor(c,p)*st.speed;
  var boardSpeed=p.board?(1+p.board.spec.speed):1;
  var target=vBase*boardSpeed*(p.blast>0?1.5:1);
  p.v+=(target-p.v)*(1-Math.exp(-dt*(p.v<target?(p.blast>0?5:1.5):4)));
  p.dist+=p.v*dt;p.phase+=dt*p.v*0.55;
  p.x+=(LANE[p.lane]-p.x)*(1-Math.exp(-dt*20));
  if(p.y>0||p.vy>0){p.vy-=GRAV*dt;p.y+=p.vy*dt;if(p.y<=0){p.y=0;p.vy=0;}}
  if(p.slide>0)p.slide-=dt;
  if(p.hitCd>0)p.hitCd-=dt;if(p.hurt>0)p.hurt-=dt;
  if(p.blast>0){p.blast-=dt;if(p.blast<=0)p.blast=0;}
  if(p.magnet>0)p.magnet-=dt;if(p.x2>0)p.x2-=dt;
  if(p.board){p.board.t-=dt;if(p.board.t<=0){p.board=null;toast('Board worn out');}}
  spawnAhead(c,vBase);
  for(i=0;i<S.obs.length;i++){
    o=S.obs[i];
    if(o.smash>0){o.smash-=dt*5;var sc=Math.max(0.001,o.smash);o.mesh.scale.setScalar(sc);o.mesh.position.y=(1-sc)*3;if(o.smash<=0)o.mesh.visible=false;continue;}
    if(o.hit)continue;
    dz=o.d-p.dist;
    if(Math.abs(dz)<0.95+o.half&&Math.abs(o.x-p.x)<0.85){
      var bad=o.type==='low'?p.y<0.82:(o.type==='high'?!(p.slide>0&&p.y<0.1):true);
      if(bad){
        o.hit=true;
        if(p.blast>0){o.smash=1;sfx.smash();}
        else if(p.hitCd<=0){
          if(p.board){p.board.hits--;p.hitCd=1.0;S.shake=0.35;sfx.hit();if(p.board.hits<=0){p.board=null;toast('Board crashed');}else toast('Board saved you');}
          else{p.v=vBase*0.3;p.hitCd=1.2;p.hurt=0.8;S.shake=0.7;sfx.hit();$('vig').style.opacity=0.6;}
        }
      }
    }
  }
  var magR=p.magnet>0?16:0;
  for(i=0;i<S.coins.length;i++){
    o=S.coins[i];if(o.got)continue;
    dz=o.d-p.dist;
    if(magR&&dz>-1&&dz<magR){var k=1-Math.exp(-dt*9);o.x+=(p.x-o.x)*k;o.y+=((p.y+0.9)-o.y)*k;o.d+=(p.dist-o.d)*k*0.7;o.mesh.position.set(o.x,o.y,-o.d);dz=o.d-p.dist;}
    if(Math.abs(dz)<1.0&&Math.abs(o.x-p.x)<0.9&&Math.abs(o.y-(p.y+0.9))<1.15){
      o.got=true;o.mesh.visible=false;p.coins+=(p.x2>0?2:1);if(p.blast<=0)p.meter=Math.min(100,p.meter+4*st.charge);sfx.coin();
    }
  }
  for(i=0;i<S.picks.length;i++){
    o=S.picks[i];if(o.got)continue;
    dz=o.d-p.dist;o.mesh.position.y=1.3+Math.sin(S.t*5)*0.15;
    if(Math.abs(dz)<1.2&&Math.abs(o.x-p.x)<0.9){
      o.got=true;o.mesh.visible=false;sfx.pick();
      if(o.type==='magnet'){p.magnet=8*st.magnet;toast('Magnet');}
      else if(o.type==='x2'){p.x2=10;toast('Double coins');}
      else{p.meter=Math.min(100,p.meter+35);toast('Boost charge');}
    }
  }
  S.obs=S.obs.filter(function(o){if(o.d<p.dist-12-o.half){scene.remove(o.mesh);return false;}return true;});
  S.coins=S.coins.filter(function(o){if(o.d<p.dist-12){scene.remove(o.mesh);return false;}return true;});
  S.picks=S.picks.filter(function(o){if(o.d<p.dist-12){scene.remove(o.mesh);return false;}return true;});
  var wSpeed=vBaseFor(c,p)*(0.95+0.015*c.lvl)*st.warden;
  S.gap=Math.min(S.gapMax,S.gap+(p.v-wSpeed)*dt);
  S.bots.forEach(function(b){updateBot(b,dt,c,vBaseFor(c,p));});
  if(S.gap<=0){S.gap=0;endRace(false);return;}
  if(p.dist>=c.goal){
    var done=S.bots.filter(function(b){return b.finished;});
    S.rank=done.length+1;
    if(done.length){done.sort(function(a,b){return a.finishTime-b.finishTime;});S.firstBot=done[0].name;}
    endRace(true);
  }
}
function updateBot(b,dt,c,vBase){
  var p=S.p,i,o;
  b.nextSurge-=dt;if(b.nextSurge<=0){b.surge=2;b.nextSurge=rnd(14,24);if(!b.finished)toast(b.name+' blasts!');}
  if(b.surge>0)b.surge-=dt;
  var target=vBase*b.skill*(1+clamp((p.dist-b.dist)/200,-0.06,0.12))*(b.surge>0?1.3:1);
  b.v+=(target-b.v)*(1-Math.exp(-dt*(b.v<target?1.5:4)));
  b.dist+=b.v*dt;b.phase+=dt*b.v*0.55;
  if(b.hurt>0)b.hurt-=dt;
  if(b.y>0||b.vy>0){b.vy-=GRAV*dt;b.y+=b.vy*dt;if(b.y<=0){b.y=0;b.vy=0;}}
  if(b.slide>0)b.slide-=dt;
  if(!b.finished&&b.dist>=c.goal){b.finished=true;b.finishTime=S.time;toast(b.name+' hit the gate');}
  spawnBotObs(b,c);
  var react=b.v*0.3;
  for(i=0;i<b.obs.length;i++){
    o=b.obs[i];var d=o.d-b.dist;
    if(!o.acted&&d<react&&d>0){o.acted=true;if(Math.random()>b.err){if(o.type==='low'){b.vy=14;}else{b.slide=0.55;}}}
    if(!o.hit&&Math.abs(d)<0.95){
      var bad=o.type==='low'?b.y<0.82:!(b.slide>0&&b.y<0.1);
      if(bad){o.hit=true;b.v=vBase*0.3;b.hurt=0.8;}
    }
  }
  b.obs=b.obs.filter(function(o){if(o.d<b.dist-12){scene.remove(o.mesh);return false;}return true;});
}

/* ---------- main update ---------- */
function update(dt){
  S.t+=dt;DT=dt;
  var c=CITIES[S.city],p=S.p;
  if(S.mode==='play'){
    var n=Math.max(1,Math.ceil(dt/0.02)),k;
    for(k=0;k<n;k++){S.time+=dt/n;playStep(dt/n);if(S.mode!=='play')break;}
  }
  else if(S.mode==='count'){
    p.phase+=dt*9;S.cd-=dt;
    if(S.cd<=0.9){S.mode='play';S.goT=0.7;setCount('GO!');sfx.go();}
    else{var nn=Math.ceil(S.cd-0.9);if(nn!==S.lastN){S.lastN=nn;setCount(String(nn));sfx.tick();}}
  }
  else if(S.mode==='result'){
    if(S.win){p.v+=(10-p.v)*(1-Math.exp(-dt*1.5));p.dist+=p.v*dt;p.phase+=dt*p.v*0.55;S.bots.forEach(function(b){b.v+=(10-b.v)*(1-Math.exp(-dt*1.5));b.dist+=b.v*dt;b.phase+=dt*b.v*0.55;});}
    else{p.v=0;S.gap+=(1.6-S.gap)*(1-Math.exp(-dt*4));S.bots.forEach(function(b){b.dist+=b.v*dt;b.phase+=dt*b.v*0.55;});}
    S.resultT-=dt;if(S.resultT<=0&&$('result').hidden)showResult();
  }
  else{
    p.v+=(8-p.v)*(1-Math.exp(-dt*2));p.dist+=p.v*dt;p.phase+=dt*p.v*0.9;p.x=0;
  }
  if(S.goT>0){S.goT-=dt;if(S.goT<=0)setCount('');}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}
  visuals(dt,c);
  if(!$('hud').hidden)updateHUD(c);
}

  for(i=0;i<S.coins.length;i++){S.coins[i].mesh.rotation.y+=dt*4;}

  var cx,cy,cz;
  if(prev){
    var por=camera.aspect<0.8,far=por?7.2:4.4;cx=Math.sin(S.t*0.35)*(por?2.2:1.8);cy=por?1.7:1.45;cz=pz-far+Math.cos(S.t*0.35)*0.4;
    camera.fov+=(46-camera.fov)*(1-Math.exp(-dt*5));camera.updateProjectionMatrix();
    camera.position.set(cx,cy,cz);camera.lookAt(0,1.1,pz);
  }else{
    var vr=clamp((p.v-22)/28,0,1),tf=58+vr*12+(p.blast>0?6:0);
    camera.fov+=(tf-camera.fov)*(1-Math.exp(-dt*5));camera.updateProjectionMatrix();
    if(S.shake>0)S.shake=Math.max(0,S.shake-dt*2.2);
    var sh=S.shake*0.35+vr*0.012;
    camera.position.set(p.x*0.25+(Math.random()-0.5)*sh,camH+(Math.random()-0.5)*sh,pz+camBack);
    camera.lookAt(p.x*0.15,1.2,pz-14);
  }
  updateWeather(dt,pz);
  if(S.mode==='play'){var near=clamp((22-S.gap)/22,0,1),v=near*0.75,cur=parseFloat($('vig').style.opacity||0);if(cur>v)v=Math.max(v,cur-dt*1.5);$('vig').style.opacity=v;}
  else if(S.mode!=='result')$('vig').style.opacity=0;
  renderer.render(scene,camera);
}

var lastHud={};
function setTxt(id,v){if(lastHud[id]!==v){lastHud[id]=v;$(id).textContent=v;}}
function updateHUD(c){
  var p=S.p;
  var rank=1+S.bots.filter(function(b){return b.dist>p.dist;}).length;
  setTxt('hDist',String(Math.min(c.goal,Math.floor(p.dist))));
  setTxt('hPos',ord(rank));$('hPos').classList.toggle('first',rank===1);
  setTxt('hCoins',String(p.coins));setTxt('hGap',String(Math.max(0,Math.round(S.gap))));
  var pc=function(d){return clamp(d/c.goal,0,1)*100+'%';};
  $('dY').style.left=pc(p.dist);$('dB1').style.left=pc(S.bots[0].dist);$('dB2').style.left=pc(S.bots[1].dist);$('dW').style.left=pc(p.dist-S.gap);
  var btn=$('blastBtn'),m=p.blast>0?p.blast/3*100:p.meter;
  btn.style.setProperty('--m',m.toFixed(1));
  btn.classList.toggle('ready',p.meter>=100&&p.blast<=0);btn.classList.toggle('active',p.blast>0);
  var ch='';
  if(p.board)ch+='<span style="border-color:'+hex(p.board.spec.color)+'">'+p.board.spec.name+' '+Math.ceil(p.board.t)+'s x'+p.board.hits+'</span>';
  if(p.magnet>0)ch+='<span style="border-color:#ff3d5a">Magnet '+Math.ceil(p.magnet)+'s</span>';
  if(p.x2>0)ch+='<span style="border-color:#e0a800">x2 coins '+Math.ceil(p.x2)+'s</span>';
  if(lastHud.chips!==ch){lastHud.chips=ch;$('chips').innerHTML=ch;}
}

/* ---------- layout ---------- */
var camBack=10,camH=7;
function fitCam(){var a=camera.aspect;var D=clamp(7.8/(Math.tan(58*Math.PI/360)*a),11,30);camBack=D*0.8;camH=2.2+D*0.34;}
function resize(){var app=$('app'),w=app.clientWidth,h=app.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;fitCam();viewMode='';camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

/* ---------- wiring ---------- */
$('goBtn').addEventListener('click',function(){ensureAudio();showStory();});
$('sGo').addEventListener('click',startCountdown);
$('sBack').addEventListener('click',function(){S.mode='menu';showScreen('menu');});
$('rRetry').addEventListener('click',startCountdown);
$('rNext').addEventListener('click',function(){S.city=Math.min(CITIES.length-1,S.city+1);SAVE.city=S.city;save();applyCity(S.city);resetRace(true);showStory();});
$('rMenu').addEventListener('click',function(){enterMenu();});
$('credBtn').addEventListener('click',function(){showScreen('credits');});
$('credBack').addEventListener('click',function(){showScreen('menu');});
$('muteBtn').addEventListener('click',function(){setMute(!muted);});

applyCity(S.city);setRunnerModel();setMute(muted);resize();enterMenu();
var last=performance.now();
function frame(now){requestAnimationFrame(frame);var dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;update(dt);}
requestAnimationFrame(frame);
})();
</script>
